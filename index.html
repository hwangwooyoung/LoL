<!DOCTYPE html>
<html lang="ko">
<head>

<title>미니 롤 - 3라인 + 정글</title>
<style>
:root{--bg:#0b1220;--fg:#e8eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0b1220;--fg:#e8eefc}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#mn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c}.bx{background:#14213a;color:#e8eefc;border-radius:12px;padding:20px 24px;min-width:300px;max-width:90vw;text-align:center}button,input,select{font:inherit;margin:4px;padding:8px 14px;border-radius:8px;border:1px solid #4a6a9a;background:#1f3a66;color:#fff;cursor:pointer}
</style>

<body>
<canvas id="c"></canvas>
<div id="mn"><div class="bx"><h2>⚔️ 미니 롤</h2><div id="mb"></div></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let w,h;function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight}rs();onresize=rs;
const S=2400,COL=['#4aa3ff','#ff5a5a'],B=[{x:200,y:2200},{x:2200,y:200}];
const LANES=[[[200,2200],[230,230],[2200,200]],[[200,2200],[2200,200]],[[200,2200],[2170,2170],[2200,200]]];
const LN=['탑','미드','바텀'];
const LEN=LANES.map(p=>p.slice(1).map((q,i)=>Math.hypot(q[0]-p[i][0],q[1]-p[i][1])));
function ptAt(l,f){const p=LANES[l],ls=LEN[l];let d=f*ls.reduce((a,b)=>a+b),i=0;while(i<ls.length-1&&d>ls[i]){d-=ls[i];i++}const k=d/ls[i];return{x:p[i][0]+(p[i+1][0]-p[i][0])*k,y:p[i][1]+(p[i+1][1]-p[i][1])*k}}
const CFG={
 champ:{hp:600,ad:55,ar:20,rng:175,sp:210,as:0.9,r:20,mp:300},
 melee:{hp:300,ad:14,ar:0,rng:45,sp:95,as:1,r:13},
 ranged:{hp:210,ad:20,ar:0,rng:160,sp:95,as:1.1,r:11},
 tower:{hp:2200,ad:110,ar:40,rng:290,sp:0,as:1.2,r:30},
 nexus:{hp:3500,ad:0,ar:20,rng:0,sp:0,as:9,r:46},
 inhib:{hp:1800,ad:0,ar:20,rng:0,sp:0,as:9,r:24},
 super:{hp:1100,ad:55,ar:20,rng:55,sp:100,as:1,r:19},
 ward:{hp:3,ad:0,ar:0,rng:0,sp:0,as:9,r:8}
};
const MON={
 gromp:{n:'그롬',hp:800,ad:28,r:22,g:70,x:80,c:'#6fbf73'},
 wolf:{n:'늑대',hp:450,ad:20,r:15,g:35,x:45,c:'#9aa5b1'},
 blue:{n:'블루 버프',hp:1500,ad:45,r:28,g:120,x:150,c:'#4aa3ff'},
 red:{n:'레드 버프',hp:1500,ad:50,r:28,g:120,x:150,c:'#ff7a45'},
 drag:{n:'드래곤',hp:4000,ad:85,r:40,g:250,x:300,c:'#ffb347'},
 baron:{n:'바론',hp:7000,ad:130,r:52,g:300,x:400,c:'#b07cff'},
 herald:{n:'전령',hp:3500,ad:70,r:36,g:200,x:300,c:'#6ee7e7'},
 elder:{n:'장로 드래곤',hp:7500,ad:140,r:46,g:300,x:350,c:'#ff4d4d'}
};
const ITEMS=[
 {n:'롱소드 (+15 공격력)',c:350,f:u=>u.ad+=15},
 {n:'쇠사슬 조끼 (+20 방어력)',c:300,f:u=>u.ar+=20},
 {n:'장화 (+35 이동속도)',c:300,f:u=>u.sp+=35},
 {n:'루비 수정 (+200 체력)',c:400,f:u=>{u.mhp+=200;u.hp+=200}},
 {n:'단검 (+공격속도 25%)',c:350,f:u=>u.as*=.8},
 {n:'흡혈의 낙 (+공격력 10, 생명력 흡수 12%)',c:450,f:u=>{u.ad+=10;u.ls=(u.ls||0)+.12}},
 {n:'사파이어 수정 (+마나 300, 스킬 피해 15%)',c:450,f:u=>{u.mmp+=300;u.mp+=300;u.sm=(u.sm||1)*1.15}}
];
let U,TW,INH,CAMPS,SQ,P,E,PR,FX,T,wave,over,shop,mouse={x:0,y:0},cam={x:0,y:0};
function mk(team,type,x,y){
 const c=CFG[type];
 return {id:++NID,team,type,x,y,r:c.r,hp:c.hp,mhp:c.hp,ad:c.ad,ar:c.ar,rng:c.rng,sp:c.sp,as:c.as,t:0,
  target:null,dest:null,gold:type=='champ'?500:0,xp:0,lv:1,mp:c.mp||0,mmp:c.mp||0,
  cds:{q:0,w:0,e:0,r:0,d:0,f:0},buff:0,slow:0,dead:false,rt:0,k:0,d:0,cs:0,bb:0,rb:0,nb:0,lane:1,rk:{q:0,w:0,e:0,r:0},pt:1,eb:0};
}
function mkMon(kind,x,y,camp){
 const c=MON[kind];
 return {id:++NID,team:2,type:'mon',kind,camp,x,y,home:{x,y},r:c.r,hp:c.hp,mhp:c.hp,ad:c.ad,ar:10,rng:c.r+30,sp:150,as:1.2,t:0,agg:null,slow:0,buff:0,cds:{}};
}
function spawnCamp(c){
 c.mons=c.m.map((k,i)=>{const a=i*2.1,o=c.m.length>1?32:0;return mkMon(k,c.x+Math.cos(a)*o,c.y+Math.sin(a)*o,c)});
 U.push(...c.mons);
}
function init(){
 NID=0;WC=0;DK=0;TK=[0,0];ANN=[];U=[];TW=[];INH=[];SQ=[];PR=[];FX=[];T=0;wave=6;over=null;shop=false;
 CH=[];for(let t=0;t<2;t++)for(let i=0;i<N;i++){const c=mk(t,'champ',B[t].x+(t?-1:1)*(40+i*24),B[t].y+(t?1:-1)*(40+i*24));c.lane=[1,0,2,3,2][i];c.slot=i;c.ctl=ASSIGN[t*10+i]||'ai';applyCls(c,c.ctl==='ai'?['전사','마법사','원거리','탱커'][c.lane]:c.ctl===MYPEER?MYCLS:CLSOF[c.ctl]||'전사');CH.push(c);U.push(c)}P=CH.find(c=>c.ctl===MYPEER)||CH[0];
 for(let l=0;l<3;l++)for(const t of [0,1]){
  let prev=null;for(const f of [.42,.30,.18]){const p=ptAt(l,t?1-f:f),tw=mk(t,'tower',p.x,p.y);tw.req=prev;prev=tw;TW.push(tw);U.push(tw)}const pq=ptAt(l,t?.9:.1),ih=mk(t,'inhib',pq.x,pq.y);ih.req=prev;ih.lane=l;INH.push(ih);U.push(ih);
  
 }
 for(const t of [0,1]){
  const s=t?-1:1;for(const o of [[170,-40],[40,-170]]){const bt=mk(t,'tower',B[t].x+o[0]*s,B[t].y+o[1]*s);bt.base=1;TW.push(bt);U.push(bt)}U.push(mk(t,'nexus',B[t].x,B[t].y));
 }
 const base=[{m:['blue'],x:600,y:1400},{m:['wolf','wolf','wolf'],x:480,y:950},{m:['red'],x:900,y:1850},{m:['gromp','wolf','wolf'],x:1300,y:1950}];
 CAMPS=[];
 for(const c of base){CAMPS.push({...c,t:-1,rs:60},{...c,x:S-c.x,y:S-c.y,t:-1,rs:60})}
 CAMPS.push({m:['herald'],x:750,y:650,t:-1,rs:240,epic:1},{m:['drag'],x:1650,y:1750,t:-1,rs:150,epic:1});
 CAMPS.forEach(spawnCamp);
}
function spawnWave(){WC++;
 for(const team of [0,1])for(let l=0;l<3;l++){for(let i=0;i<4;i++)SQ.push({at:T+i*.7,team,type:i<3?'melee':'ranged',lane:l});if(INH.some(x=>x.team!=team&&x.lane==l&&x.dead))SQ.push({at:T+3,team,type:'super',lane:l});if(WC%3==0)SQ.push({at:T+3.5,team,type:'ranged',lane:l,big:1})}
}
const alive=u=>u.hp>0&&!u.dead;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const adOf=u=>u.ad+(u.rb>0?20:0)+(u.nb>0?40:0)+(u.eb>0?60:0);
function invuln(t){if(t.iv!==undefined)return !!t.iv;
 if(t.type=='tower'||t.type=='inhib'){if(t.req&&t.req.hp>0)return true;if(t.base&&!INH.some(x=>x.team==t.team&&x.dead))return true}
 if(t.type=='nexus')return TW.some(x=>x.team==t.team&&x.base&&x.hp>0);
 return false;
}
function near(u,range,tm){
 let best=null,bd=1e9;
 for(const t of U){
  if(t.team==u.team||!alive(t)||(t.team==2&&u.type!='champ')||(t.type=='ward'&&u.type!='champ')||invuln(t))continue;
  const d=dist(u,t)-t.r;if(d>range)continue;
  const s=d+(tm&&t.type!='melee'&&t.type!='ranged'&&t.type!='super'?1000:0);
  if(s<bd){bd=s;best=t}
 }
 return best;
}
function txt(x,y,s,col){FX.push({txt:s,x,y,life:.8,max:.8,col})}
function dmg(t,d,s){
 if(!alive(t))return;
 if(invuln(t)){if(s===P)txt(t.x,t.y-50,'무적','#fff');return}
 let v=d*100/(100+t.ar);if(t.sh>0){const a=Math.min(t.sh,v);t.sh-=a;v-=a}t.hp-=v;t.rc=0;if(FX.length<250)for(let i=0;i<(t.type=='champ'?4:2);i++){const a=Math.random()*6.3;FX.push({px:1,x:t.x,y:t.y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,life:.35,max:.35,col:t.team==2?'#ffd54a':t.team?'#ff6b6b':'#6bb8ff'})}if(s&&s.ls)s.hp=Math.min(s.mhp,s.hp+v*s.ls);
 if(t.type=='mon'&&s)t.agg=s;
 if(s===P||t===P)txt(t.x,t.y-t.r-8,Math.round(v),t===P?'#ff8a8a':'#ffe27a');
 if(t.hp<=0)die(t,s);
}
function addxp(u,x){
 u.xp+=x;
 while(u.lv<18&&u.xp>=u.lv*100){u.xp-=u.lv*100;u.lv++;u.pt++;u.mhp+=80;u.hp+=80;u.ad+=4;u.ar+=2;u.mmp+=20;u.mp+=20;txt(u.x,u.y-40,'LEVEL UP!','#7dffa0')}
}
function die(t,s){
 t.hp=0;
 let rw=[0,0];
 if(t.type=='mon'){const m=MON[t.kind];rw=[m.g,m.x]}
 else rw=t.type=='champ'?[300,120]:t.type=='melee'?[22,45]:t.type=='ranged'?[18,35]:t.type=='tower'?[150,100]:t.type=='inhib'?[100,60]:t.type=='super'?[60,90]:[0,0];
 if(t.big)rw=[60,70];const sc=s&&s.type=='champ';
 if(sc){s.gold+=rw[0];if(s===P&&rw[0])txt(t.x,t.y-t.r-24,'+'+rw[0],'#ffd54a');if(t.type=='melee'||t.type=='ranged'||t.type=='mon')s.cs++;if(t.type=='champ')s.k++}
 for(const c of U)if(c.type=='champ'&&alive(c)&&dist(c,t)<800&&(t.team==2?(s&&c.team==s.team):c.team!=t.team))addxp(c,rw[1]);
 if(t.type=='mon'&&sc){
  const k=t.kind;if(MON[k].x>=150)announce((s.team?'레드':'블루')+' 팀이 '+MON[k].n+' 처치!','#c9a0ff');
  if(k=='blue'){s.bb=90;txt(s.x,s.y-50,'블루 버프! 쿨다운↓','#4aa3ff')}
  if(k=='red'){s.rb=90;txt(s.x,s.y-50,'레드 버프! 공격력↑','#ff7a45')}
  if(k=='drag'){for(const c of U)if(c.type=='champ'&&c.team==s.team){c.ad+=10;c.mhp+=100;c.hp+=100}txt(s.x,s.y-50,'드래곤! 팀 영구 강화','#ffb347');DK++;if(DK>=3)CAMPS.forEach(c=>{if(c.m[0]=='drag')c.m=['elder']})}
  if(k=='elder'){for(const c of U)if(c.type=='champ'&&c.team==s.team)c.eb=70;txt(s.x,s.y-50,'장로 드래곤! 팀 강화','#ff4d4d')}
  if(k=='herald'){const dl=[0,1,2].map(l=>{let m=1e9;for(let f=0;f<=1;f+=.05){const p=ptAt(l,f);m=Math.min(m,Math.hypot(p.x-s.x,p.y-s.y))}return m}),li=dl.indexOf(Math.min(...dl)),hm=mk(s.team,'super',s.x,s.y);hm.lane=li;hm.wp=s.team?LANES[li].slice().reverse():LANES[li];hm.wi=1;hm.hp=hm.mhp=2500;hm.ad=150;hm.r=30;U.push(hm);txt(s.x,s.y-50,'전령 소환!','#6ee7e7')}
  if(k=='baron'){for(const c of U)if(c.type=='champ'&&c.team==s.team)c.nb=70;txt(s.x,s.y-50,'바론 버프! 팀 강화','#b07cff')}
 }
 if(t.type=='champ'){t.dead=true;t.d++;t.rt=6+t.lv*2.5;t.target=null;t.dest=null;TK[1-t.team]++;announce(TK[0]+TK[1]==1?'퍼스트 블러드!':(t.team?'블루':'레드')+' 팀이 챔피언을 처치했습니다',t.team?'#6bb8ff':'#ff6b6b');if(t===P)SHK=.5}
 if(t.type=='nexus'){over='w'+(1-t.team);SHK=1}
 if(t.type=='tower'){announce((t.team?'레드':'블루')+' 포탑 파괴!','#ffd54a');SHK=.4}
 if(t.type=='inhib'){t.dead=true;t.rt=90;txt(t.x,t.y-50,'억제기 파괴!','#fff');announce((t.team?'레드':'블루')+' 억제기 파괴!','#ffd54a');SHK=.6}
}
function attack(u,t){
 if(u.stun>0)return;u.t=u.as;u.at=performance.now();u.fa=Math.atan2(t.y-u.y,t.x-u.x);let d=adOf(u);if(u.type=='tower'){if(u.lt===t)u.st=Math.min((u.st||0)+1,5);else{u.lt=t;u.st=0}d*=1+.3*u.st}
 if(u.rng>100&&u.type!='mon')PR.push({k:'home',t,x:u.x,y:u.y,team:u.team,d,s:u,sp:750});
 else dmg(t,d,u);
}
function moveTo(u,x,y,dt){
 const dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy);
 if(u.stun>0)return false;if(d<2)return true;u.fa=Math.atan2(dy,dx);
 const sp=u.sp*(u.buff>0?1.5:1)*(u.slow>0?.55:1),st=Math.min(sp*dt,d);
 u.x=Math.max(20,Math.min(S-20,u.x+dx/d*st));u.y=Math.max(20,Math.min(S-20,u.y+dy/d*st));
 return false;
}
const COST={q:40,w:50,e:60,r:100},CD={q:5,w:12,e:8,r:45};
function dashTo(u,x,y,m){const dx=x-u.x,dy=y-u.y,d=Math.hypot(dx,dy)||1,k=Math.min(d,m);u.x=Math.max(20,Math.min(S-20,u.x+dx/d*k));u.y=Math.max(20,Math.min(S-20,u.y+dy/d*k));u.fa=Math.atan2(dy,dx);u.dest=null;FX.push({ring:1,x:u.x,y:u.y,r:45,life:.3,max:.3,col:'#ffffff'})}
function aoe(u,x,y,r,d,slow,stun,col){FX.push({ring:1,x,y,r,life:.5,max:.5,col});for(const t of U)if(t.team!=u.team&&alive(t)&&Math.hypot(t.x-x,t.y-y)<r+t.r){dmg(t,d,u);if(slow)t.slow=slow;if(stun)t.stun=stun}}
function shot(u,x,y,d,r,life,pierce,off){const a=Math.atan2(y-u.y,x-u.x)+(off||0);PR.push({k:'line',x:u.x,y:u.y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,team:u.team,d,s:u,life,r,pierce})}
const SK={
 '전사 q':0,
 '전사q':(u,x,y,a)=>{dashTo(u,x,y,260);aoe(u,u.x,u.y,110,(30+u.rk.q*45+a*.7)*(u.sm||1),1.5,0,'#ffd54a')},
 '전사w':u=>{u.sh=60+u.rk.w*40;u.sht=3;FX.push({ring:1,x:u.x,y:u.y,r:45,life:.6,max:.6,col:'#99aadd'})},
 '전사r':(u,x,y,a)=>{let t=null,b=1e9;for(const e of U)if(e.team!=u.team&&alive(e)&&e.sp>0&&e.type!='ward'){const d=dist(u,e);if(d<500&&d<b){b=d;t=e}}if(!t)return false;dashTo(u,t.x,t.y,500);dmg(t,(60+u.rk.r*90+a*.8)*(u.sm||1)+(1-t.hp/t.mhp)*120*u.rk.r,u);t.stun=1},
 '마법사w':(u,x,y)=>dashTo(u,x,y,320),
 '마법사e':(u,x,y)=>{const d=Math.hypot(x-u.x,y-u.y)||1,m=Math.min(d,550);aoe(u,u.x+(x-u.x)/d*m,u.y+(y-u.y)/d*m,150,(20+u.rk.e*35+u.ad*.5)*1.5,2.5,0,'#9be7ff')},
 '원거리q':(u,x,y,a)=>{for(const o of [-.25,0,.25])shot(u,x,y,(20+u.rk.q*25+a*.5)*(u.sm||1),12,.8,0,o)},
 '원거리e':(u,x,y)=>{aoe(u,u.x,u.y,150,15+u.rk.e*20,2,.6,'#ffd54a');const a=Math.atan2(u.y-y,u.x-x);dashTo(u,u.x+Math.cos(a)*260,u.y+Math.sin(a)*260,260)},
 '원거리r':(u,x,y,a)=>shot(u,x,y,120+u.rk.r*150+a*1.2,22,1.6,1,0),
 '탱커q':(u,x,y,a)=>{dashTo(u,x,y,180);aoe(u,u.x,u.y,100,25+u.rk.q*35+a*.5,1.5,.7,'#c5cde0')},
 '탱커w':u=>{if(!(u.ab>0))u.ar+=40;u.ab=4;u.sh=80+u.rk.w*40;u.sht=4},
 '탱커e':u=>aoe(u,u.x,u.y,190,25+u.rk.e*35+u.ad*.4,2.5,0,'#a9743a'),
 '탱커r':(u,x,y,a)=>{dashTo(u,x,y,450);aoe(u,u.x,u.y,200,80+u.rk.r*110+a*.6,0,1.3,'#ff9a3a')}
};
function cast(u,k,tx,ty){
 if(!alive(u)||u.cds[k]>0||u.mp<COST[k]||!u.rk[k]||u.stun>0)return;
 if(k=='r'&&u.lv<6)return;
 u.cds[k]=CD[k];u.mp-=COST[k];const a0=adOf(u);const sf=SK[u.cls+k];if(sf){if(sf(u,tx,ty,a0)===false){u.cds[k]=0;u.mp+=COST[k]}return}
 if(k=='q'){
  const a=Math.atan2(ty-u.y,tx-u.x);
  PR.push({k:'line',x:u.x,y:u.y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,team:u.team,d:(30+u.rk.q*40+a0*.6)*(u.sm||1),s:u,life:.8,r:14});
 }else if(k=='w'){u.buff=3;u.hp=Math.min(u.mhp,u.hp+20+u.rk.w*25);FX.push({ring:1,x:u.x,y:u.y,r:40,life:.5,max:.5,col:'#7dffa0'})}
 else if(k=='e'){
  FX.push({ring:1,x:u.x,y:u.y,r:130,life:.4,max:.4,col:'#ffd54a'});
  for(const t of U)if(t.team!=u.team&&alive(t)&&dist(u,t)<130+t.r){dmg(t,(20+u.rk.e*30+a0*.4)*(u.sm||1),u);t.slow=2}
 }else{
  const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy),m=Math.min(d,600);
  const cx=d?u.x+dx/d*m:u.x,cy=d?u.y+dy/d*m:u.y;
  FX.push({ring:1,x:cx,y:cy,r:220,life:.6,max:.6,col:'#c77dff'});
  for(const t of U)if(t.team!=u.team&&alive(t)&&Math.hypot(t.x-cx,t.y-cy)<220+t.r)dmg(t,(100+u.rk.r*120+a0*.8)*(u.sm||1),u);

function spell(c,k,x,y){
 if(c.cds[k]>0)return;
 if(k=='d'){const dx=x-c.x,dy=y-c.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,400);c.cds.d=60;c.x=Math.max(20,Math.min(S-20,c.x+dx/d*m));c.y=Math.max(20,Math.min(S-20,c.y+dy/d*m));c.dest=null;FX.push({ring:1,x:c.x,y:c.y,r:50,life:.4,max:.4,col:'#ffffff'})}
 else{let t=null,bd=1e9;for(const e of CH)if(e.team!=c.team&&alive(e)){const dd=dist(c,e);if(dd<600&&dd<bd){bd=dd;t=e}}if(!t)return;c.cds.f=45;t.ig=5;t.igd=40+c.lv*8;t.igs=c;FX.push({ring:1,x:t.x,y:t.y,r:40,life:.5,max:.5,col:'#ff6a3d'})}
}
function act(c,o){
 if(!c||c.dead||over)return;if(o.a!='rc'&&o.a!='buy'&&o.a!='lv')c.rc=0;
 if(o.a=='mv'){c.target=null;c.am=0;c.dest={x:o.x,y:o.y}}
 else if(o.a=='am'){c.target=null;c.am=1;c.dest={x:o.x,y:o.y}}
 else if(o.a=='tg'){const t=U.find(u=>u.id==o.id);if(t&&t.team!=c.team&&alive(t)){c.target=t;c.dest=null}}
 else if(o.a=='cast')cast(c,o.k,o.x,o.y);
 else if(o.a=='buy'){if(dist(c,B[c.team])<300)buy(c,o.i)}
 else if(o.a=='st'){c.target=null;c.dest=null}
 else if(o.a=='rc'){if(dist(c,B[c.team])>260)c.rc=8}
 else if(o.a=='lv')learn(c,o.k);
 else if(o.a=='sp')spell(c,o.k,o.x,o.y);
 else if(o.a=='wd'){if(U.filter(q=>q.own===c&&q.hp>0).length<3){const d=Math.hypot(o.x-c.x,o.y-c.y),f=d?Math.min(d,500)/d:0,wd=mk(c.team,'ward',c.x+(o.x-c.x)*f,c.y+(o.y-c.y)*f);wd.own=c;wd.life=90;U.push(wd)}}
}
function input(o){if(NET=='c'){RM&&RM.emit('inp',o)}else act(P,o)}
function toMenu(){
 playing=false;NET='s';over=null;if(RM){RM.leave();RM=null}
 mn.style.display='flex';
 const sel=document.createElement('select');[1,3,5].forEach(n=>sel.add(new Option(n+' vs '+n,n)));sel.value=N;sel.onchange=()=>N=+sel.value;
 const cs=document.createElement('select');Object.keys(CLS).forEach(k=>cs.add(new Option(k,k)));cs.value=MYCLS;cs.onchange=()=>MYCLS=cs.value;
 const ci=document.createElement('input');ci.placeholder='방 코드';ci.size=6;
 show(line('모드/챔피언 선택'),sel,cs,document.createElement('br'),btn('AI 대전 (혼자)',()=>begin('s',{0:'solo'},'solo')),btn('온라인 방 만들기',host),document.createElement('br'),ci,btn('방 참가',()=>join(ci.value.trim().toLowerCase())),line('온라인 PvP: 같은 조직 구성원/초대받은 사람만 가능 · 빈 자리는 AI가 채웁니다'));
}
function begin(mode,assign,me){NET=mode;ASSIGN=assign;MYPEER=me;init();playing=true;mn.style.display='none'}
async function connect(c){
 const r=window.claude&&claude.use?await claude.use('room'):null;
 if(!r){show(line('온라인(room)을 사용할 수 없는 환경입니다.'),btn('뒤로',toMenu));return null}
 try{RM=await r.join('mlol-'+c)}catch(e){show(line('접속 실패: '+(e.code||e)),btn('뒤로',toMenu));return null}
 return RM;
}
function lobbyUI(code){show(line('방 코드: '+code),line('참가자 '+peers.length+'/'+2*N+'명 (빈 자리는 AI)'),btn('게임 시작',()=>{
 ASSIGN={};peers.forEach((p,i)=>ASSIGN[(i%2)*10+(i>>1)]=p);RM.emit('lobby',{a:'start',n:N,peers});begin('h',ASSIGN,MYPEER)}),btn('취소',toMenu))}
async function host(){
 const code=Math.random().toString(36).slice(2,6);
 if(!await connect(code))return;
 NET='h';peers=[];lobbyUI(code);
 RM.on('lobby',m=>{const d=m.data||{};if(playing||d.a!='join')return;
  if(m.isMe&&m.sameTab)MYPEER=m.peer;
  CLSOF[m.peer]=d.cls;if(!peers.includes(m.peer)&&peers.length<2*N)peers.push(m.peer);
  lobbyUI(code);RM.emit('lobby',{a:'roster',n:N,peers,host:peers[0]})});
 RM.on('inp',m=>{const c=CH.find(c=>c.ctl===m.peer);if(c&&m.data)act(c,m.data)});
 RM.emit('lobby',{a:'join',cls:MYCLS});
}
async function join(c){
 if(!c||!await connect(c))return;
 NET='c';show(line('접속 중…'),btn('취소',toMenu));
 RM.on('lobby',m=>{const d=m.data||{};
  if(m.isMe&&m.sameTab&&d.a=='join')MYPEER=m.peer;
  if(d.a=='roster'&&!playing){hostPeer=d.host;show(line('방 '+c+' 대기 중… 참가자 '+d.peers.length+'명'),btn('취소',toMenu))}
  if(d.a=='start'&&m.peer===hostPeer&&!playing)beginClient(d.n,d.peers)});
 RM.on('snap',onSnap);
 const j=()=>{if(NET=='c'&&!playing&&RM){RM.emit('lobby',{a:'join',cls:MYCLS});setTimeout(j,2000)}};j();
}
function beginClient(n,pl){
 const i=pl.indexOf(MYPEER);if(i<0){show(line('방이 가득 찼습니다.'),btn('뒤로',toMenu));return}
 N=n;UM={};MYID=(i%2)*N+(i>>1)+1;
 PH={x:200,y:2200,team:i%2,hp:1,mhp:1,mp:0,mmp:1,cds:{q:0,w:0,e:0,r:0},rk:{q:0,w:0,e:0,r:0},pt:1,lv:1,xp:0,gold:0,k:0,d:0,cs:0,bb:0,rb:0,nb:0,dead:false,rt:0,r:20,type:'champ'};
 U=[];PR=[];FX=[];CAMPS=[];T=0;over=null;shop=false;P=PH;playing=true;mn.style.display='none';
}
function sendSnap(){
 snapN++;const full=snapN%20==1,a=[];
 for(const u of U){
  const b=[u.id,Math.round(u.x),Math.round(u.y),Math.ceil(u.hp),u.mhp|0,(invuln(u)?1:0)|(u.dead?2:0),Math.ceil(u.rt||0),u.lv||0];
  if(full||u.nw===undefined)b.push(u.team,u.type,u.kind||'',u.r);
  u.nw=0;a.push(b);
 }
 for(let i=0;i<a.length;i+=45)RM.emit('snap',{u:a.slice(i,i+45)});
 RM.emit('snap',{m:1,T:Math.round(T),o:over,tk:TK,an:OUT.splice(0),
  c:CH.map(c=>[c.id,c.mp|0,c.mmp,c.gold|0,c.xp|0,c.k,c.d,c.cs,Math.ceil(c.bb),Math.ceil(c.rb),Math.ceil(c.nb),+c.cds.q.toFixed(1),+c.cds.w.toFixed(1),+c.cds.e.toFixed(1),+c.cds.r.toFixed(1),c.cls||'',c.rk.q,c.rk.w,c.rk.e,c.rk.r,c.pt,+c.cds.d.toFixed(0),+c.cds.f.toFixed(0),(c.inv||[]).join('')]),
  k:CAMPS.map(c=>Math.ceil(c.t)),cp:full?CAMPS.map(c=>[c.x|0,c.y|0,c.epic?1:0]):0,
  p:PR.map(p=>[p.x|0,p.y|0,p.k=='line'?1:0,p.team]),
  f:FX.filter(f=>f.ring&&f.life>f.max-.2).map(f=>[f.x|0,f.y|0,f.r,f.col,f.max])});
}
function onSnap(m){
 if(m.peer!==hostPeer||NET!='c'||!m.data)return;const d=m.data,now=performance.now();
 if(d.u)for(const a of d.u){
  let u=UM[a[0]];
  if(!u){if(a.length<12)continue;u=UM[a[0]]={id:a[0],team:a[8],type:a[9],kind:a[10],r:a[11],x:a[1],y:a[2],cds:{q:0,w:0,e:0,r:0},rk:{q:0,w:0,e:0,r:0},pt:0,bb:0,rb:0,nb:0,gold:0,xp:0,k:0,d:0,cs:0,mp:0,mmp:1}}
  u.tx=a[1];u.ty=a[2];u.hp=a[3];u.mhp=a[4];u.iv=a[5]&1;u.dead=!!(a[5]&2);u.rt=a[6];u.lv=a[7];u.seen=now;
 }
 if(d.m){
  T=d.T;over=d.o;TK=d.tk||TK;for(const a of d.an||[])ANN.push({e:performance.now()+3500,m:a[0],c:a[1]});
  for(const c of d.c){const u=UM[c[0]];if(u){u.mp=c[1];u.mmp=c[2];u.gold=c[3];u.xp=c[4];u.k=c[5];u.d=c[6];u.cs=c[7];u.bb=c[8];u.rb=c[9];u.nb=c[10];u.cds={q:c[11],w:c[12],e:c[13],r:c[14]};u.cls=c[15];u.rk={q:c[16],w:c[17],e:c[18],r:c[19]};u.pt=c[20];u.cds.d=c[21];u.cds.f=c[22];u.inv=c[23]?String(c[23]).split('').map(Number):[]}}
  if(d.cp)CAMPS=d.cp.map((c,i)=>({x:c[0],y:c[1],epic:c[2],t:d.k[i]}));
  else d.k.forEach((t,i)=>{if(CAMPS[i])CAMPS[i].t=t});
  PR=d.p.map(p=>({x:p[0],y:p[1],k:p[2]?'line':'home',team:p[3],r:14}));
  for(const f of d.f)FX.push({ring:1,x:f[0],y:f[1],r:f[2],col:f[3],life:f[4],max:f[4]});
 }
}
function cstep(dt){
 const now=performance.now();
 for(const k in UM){const u=UM[k];if(now-u.seen>1500){delete UM[k];continue}const ex=u.tx-u.x,ey=u.ty-u.y;if(ex*ex+ey*ey>4)u.fa=Math.atan2(ey,ex);u.x+=(u.tx-u.x)*Math.min(1,dt*10);u.y+=(u.ty-u.y)*Math.min(1,dt*10)}
 U=Object.values(UM);P=UM[MYID]||PH;
 for(const f of FX)f.life-=dt;FX=FX.filter(f=>f.life>0);
}
buildMap();let sb=false;addEventListener('keyup',e=>{if(e.key=='Tab')sb=false});
toMenu();
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(playing){if(NET=='c')cstep(dt);else{update(dt);if(NET=='h'&&(snapT-=dt)<=0){snapT=.2;sendSnap()}}draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
